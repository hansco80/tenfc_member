<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenFC 풋살팀 통합 시스템 v1.02</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS 라이브러리 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 로그인 화면 -->
    <div id="login-container" class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-emerald-400">⚽ TenFC 풋살팀</h1>
            <p class="text-slate-400 text-sm mt-1">멤버 평점 및 출석 관리 시스템 <span class="text-emerald-400 font-bold">v1.02</span></p>
        </div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">성명</label>
                <input type="text" id="name-input" required placeholder="예: 오한결 또는 테스트" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">비밀번호 (초기값: 핸드폰 뒷 4자리 또는 0000)</label>
                <input type="password" id="phone-input" required placeholder="예: 0005 또는 0000" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition duration-200 shadow-lg shadow-emerald-900/40">로그인</button>
        </form>
        <p id="login-error" class="text-rose-400 text-sm text-center mt-4 hidden">이름 또는 비밀번호가 일치하지 않습니다.</p>
    </div>

    <!-- 대시보드 화면 -->
    <div id="dashboard-container" class="w-full max-w-2xl bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700 hidden">
        <div id="admin-switch-bar" class="hidden mb-4 p-2 bg-slate-900/80 rounded-lg border border-emerald-500/40 flex justify-between items-center">
            <span id="admin-badge-text" class="text-xs text-emerald-400 font-semibold px-2">🛡️ 관리자 권한 보유 계정</span>
            <button onclick="switchToAdmin()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded transition">관리자 대시보드로 이동하기 ➡️</button>
        </div>
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h2 id="user-welcome" class="text-2xl font-bold text-white"></h2>
                <p class="text-xs text-slate-400 mt-1">팀 총 진행 매치: <span id="team-total-matches-display" class="font-bold text-amber-400">20회</span></p>
            </div>
            <div class="flex gap-2">
                <button onclick="openPwModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg transition">비밀번호 변경</button>
                <button onclick="logout()" class="px-3 py-1.5 bg-rose-900/40 hover:bg-rose-800/60 text-rose-300 text-xs rounded-lg transition border border-rose-700/50">로그아웃</button>
            </div>
        </div>
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 mb-6 flex items-center gap-4">
            <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-emerald-500 bg-slate-800 flex items-center justify-center text-2xl font-bold text-emerald-400">
                <span id="user-photo-fallback">⚽</span>
            </div>
            <div class="flex-1 grid grid-cols-2 gap-2 text-xs text-slate-300">
                <div>포지션: <span id="prof-position" class="text-emerald-400">-</span></div>
                <div>연락처: <span id="prof-phone" class="text-white">-</span></div>
            </div>
        </div>
    </div>

    <!-- 관리자 대시보드 화면 -->
    <div id="admin-container" class="w-full max-w-5xl bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700 hidden">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h2 id="admin-title" class="text-2xl font-bold text-emerald-400">🛡️ 관리자 대시보드</h2>
                <p class="text-xs text-slate-400 mt-1">팀 전체 총 매치: <span id="admin-team-matches" class="font-bold text-amber-400">20회</span></p>
            </div>
            <button onclick="logout()" class="px-3 py-1.5 bg-rose-900/40 text-rose-300 text-xs rounded-lg border border-rose-700/50">로그아웃</button>
        </div>

        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-800 text-slate-400 uppercase">
                    <tr>
                        <th class="p-3">성명</th>
                        <th class="p-3">출생년도</th>
                        <th class="p-3">포지션</th>
                        <th class="p-3">현재 평점</th>
                        <th class="p-3">출석 횟수</th>
                        <th class="p-3">연락처</th>
                    </tr>
                </thead>
                <tbody id="admin-member-list" class="divide-y divide-slate-700/50">
                    <!-- 데이터 로딩 전 안내 메시지 -->
                    <tr><td colspan="6" class="p-4 text-center text-slate-400">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Supabase 클라이언트 초기화 (정확한 API 키 고정)
        const SUPABASE_URL = 'https://bxuiwomkpgqsbyaagmlp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mXkGsaxwwfnnAR3lpE8T1A_n0kiPdZj'; 
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        let membersData = [];
        let currentUser = null;

        async function fetchMembers() {
            try {
                const { data, error } = await db.from('members').select('*');
                if (error) {
                    console.error('Supabase 에러:', error);
                    alert('데이터베이스 연결 오류: ' + error.message);
                    return false;
                }

                if (data && data.length > 0) {
                    membersData = data.map(item => ({
                        id: item.id,
                        name: item.name,
                        password: item.password,
                        fullPhone: item.full_phone,
                        kakaoId: item.kakao_id,
                        photo: item.photo || "",
                        birth: item.birth,
                        address: item.address,
                        position: item.position,
                        rating: item.rating,
                        joinDate: item.join_date,
                        role: item.role,
                        isWithdrawn: item.is_withdrawn,
                        attendedMatches: item.attended_matches,
                        history: item.history || [],
                        feedback: item.feedback
                    }));
                    return true;
                } else {
                    console.warn('데이터가 비어있습니다.');
                    return false;
                }
            } catch (err) {
                console.error('통신 예외 발생:', err);
                return false;
            }
        }

        async function initApp() {
            const success = await fetchMembers();
            if (!success) {
                alert('서버에서 멤버 데이터를 가져오지 못했습니다. Supabase 설정 또는 네트워크를 확인해주세요.');
                return;
            }
            
            const savedUserName = localStorage.getItem('tenfc_logged_user');
            if (savedUserName) {
                const foundUser = membersData.find(m => m.name === savedUserName);
                if (foundUser && !foundUser.isWithdrawn) {
                    currentUser = foundUser;
                    document.getElementById('login-container').classList.add('hidden');
                    if (currentUser.role === 'admin' || currentUser.role === 'sub_admin') {
                        document.getElementById('admin-container').classList.remove('hidden');
                        loadAdminDashboard();
                    } else {
                        document.getElementById('dashboard-container').classList.remove('hidden');
                    }
                } else {
                    localStorage.removeItem('tenfc_logged_user');
                }
            }
        }

        initApp();

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputName = document.getElementById('name-input').value.trim();
            const inputPw = document.getElementById('phone-input').value.trim();

            const user = membersData.find(m => m.name === inputName && m.password === inputPw);

            if (user) {
                currentUser = user;
                localStorage.setItem('tenfc_logged_user', user.name); 
                document.getElementById('login-container').classList.add('hidden');
                
                if (user.role === 'admin' || user.role === 'sub_admin') {
                    document.getElementById('admin-container').classList.remove('hidden');
                    loadAdminDashboard();
                } else {
                    document.getElementById('dashboard-container').classList.remove('hidden');
                }
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        function loadAdminDashboard() {
            const tbody = document.getElementById('admin-member-list');
            tbody.innerHTML = '';

            if (membersData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-rose-400">등록된 멤버 데이터가 없습니다.</td></tr>`;
                return;
            }

            membersData.forEach(m => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/35 transition";
                tr.innerHTML = `
                    <td class="p-3 font-bold text-white">${m.name}</td>
                    <td class="p-3 text-slate-300">${m.birth || '-'}</td>
                    <td class="p-3 text-slate-300">${m.position || '-'}</td>
                    <td class="p-3 font-extrabold text-emerald-400">${m.rating || '-'}</td>
                    <td class="p-3 text-slate-300">${m.attendedMatches || 0}회</td>
                    <td class="p-3 text-slate-300">${m.fullPhone || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('tenfc_logged_user'); 
            document.getElementById('dashboard-container').classList.add('hidden');
            document.getElementById('admin-container').classList.add('hidden');
            document.getElementById('login-container').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }
    </script>
</body>
</html>
