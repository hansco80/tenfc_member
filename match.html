<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenFC - 매치 및 투표 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- 상단 내비게이션 -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl font-black text-emerald-400">⚽ TenFC 매치</span>
                <span id="userBadge" class="text-xs bg-slate-700 px-2 py-1 rounded-full text-slate-300">확인 중...</span>
            </div>
            <div>
                <a href="index.html" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-lg transition">
                    🏠 메인으로
                </a>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 관리자 전용: 새 일정 등록 버튼 및 패널 -->
        <div id="adminControlPanel" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg flex justify-between items-center">
            <div>
                <h2 class="font-bold text-emerald-400">⚡ 관리자 메뉴</h2>
                <p class="text-xs text-slate-400">새로운 운동 일정을 등록하거나 매치를 관리할 수 있습니다.</p>
            </div>
            <button onclick="openMatchModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-xl shadow transition">
                + 새 운동 일정 등록
            </button>
        </div>

        <!-- 매치 목록 및 투표 영역 -->
        <section id="matchSection" class="space-y-6">
            <div class="text-center py-10 text-slate-400">매치 정보를 불러오는 중입니다...</div>
        </section>

    </main>

    <!-- 새 일정 등록 모달 -->
    <div id="matchModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-black text-emerald-400">새 운동 일정 등록</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">구장 선택 또는 입력</label>
                    <input type="text" id="venueInput" placeholder="예: 수원 월드컵구장 보조구장" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">일시</label>
                        <input type="datetime-local" id="matchDateInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">정원 (명)</label>
                        <input type="number" id="capacityInput" value="18" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">비용 안내</label>
                    <input type="text" id="costInput" placeholder="예: 10,000원 (뒷풀이 포함)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeMatchModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold">취소</button>
                <button onclick="createMatch()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // Supabase 설정 (index.html과 동일한 프로젝트 키 사용)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co'; // 본인의 URL로 유지 또는 연동
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let isAdmin = false;

        window.addEventListener('DOMContentLoaded', async () => {
            // URL 파라미터 (?view=이름) 또는 로컬스토리지 확인
            const urlParams = new URLSearchParams(window.location.search);
            let viewUser = urlParams.get('view');

            if (viewUser) {
                viewUser = decodeURIComponent(viewUser);
                currentUser = { name: viewUser };
                localStorage.setItem('tenfc_logged_user', viewUser);
            } else {
                const saved = localStorage.getItem('tenfc_logged_user');
                if (saved) {
                    currentUser = { name: saved };
                } else {
                    currentUser = { name: '비회원 (방문자)' };
                }
            }

            // 관리자 권한 확인 (예: 오한결 또는 운영진 이름인 경우)
            if (currentUser.name === '오한결' || currentUser.name === '관리자') {
                isAdmin = true;
                document.getElementById('adminControlPanel').classList.remove('hidden');
            }

            document.getElementById('userBadge').innerText = `접속자: ${currentUser.name} ${isAdmin ? '(관리자)' : ''}`;

            await loadMatches();
        });

        async function loadMatches() {
            const section = document.getElementById('matchSection');
            try {
                // 매치 목록 가져오기
                let { data: matches, error } = await supabase
                    .from('matches')
                    .select('*')
                    .order('match_date', { ascending: true });

                if (error || !matches || matches.length === 0) {
                    section.innerHTML = `
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center space-y-4">
                            <p class="text-slate-400">등록된 운동 일정이 없습니다.</p>
                            ${isAdmin ? '<p class="text-xs text-emerald-400">상단의 [+ 새 운동 일정 등록] 버튼을 눌러 일정을 만들어주세요!</p>' : ''}
                        </div>`;
                    return;
                }

                let html = '';
                for (let match of matches) {
                    // 해당 매치의 투표 현황 가져오기
                    let { data: votes } = await supabase
                        .from('match_votes')
                        .select('*')
                        .eq('match_id', match.id);

                    votes = votes || [];

                    // 확정 / 대기 / 미정 / 불참 분류
                    // 규칙: 용병/지인은 무조건 대기, 가입전 참가자는 확정 하단
                    let confirmed = [];
                    let waiting = [];
                    let pending = [];
                    let absent = [];

                    votes.forEach(v => {
                        if (v.status === '참석') {
                            if (v.guest_type === '용병' || v.guest_type === '지인') {
                                waiting.push(v); // 용병/지인은 무조건 대기열
                            } else {
                                confirmed.push(v);
                            }
                        } else if (v.status === '미정') {
                            pending.push(v);
                        } else if (v.status === '불참') {
                            absent.push(v);
                        }
                    });

                    // 정원 컷오프 처리 (기본 정원 18명 기준, 가입전 참가자는 뒤로 정렬)
                    confirmed.sort((a, b) => {
                        if (a.guest_type === '가입전 참가' && b.guest_type !== '가입전 참가') return 1;
                        if (a.guest_type !== '가입전 참가' && b.guest_type === '가입전 참가') return -1;
                        return new Date(a.voted_at) - new Date(b.voted_at);
                    });

                    let activeConfirmed = confirmed.slice(0, match.capacity);
                    let overflowConfirmed = confirmed.slice(match.capacity);
                    waiting = [...overflowConfirmed, ...waiting]; // 초과 인원 및 용병은 대기자로

                    html += `
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-700 pb-4">
                                <div>
                                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-bold">${match.match_type || '정기운동'}</span>
                                    <h2 class="text-lg font-black mt-2 text-slate-100">📅 ${new Date(match.match_date).toLocaleString()}</h2>
                                    <p class="text-xs text-slate-400 mt-1">📍 구장: ${match.venue_id || '미정'} | 비용: ${match.cost_amount || '미정'}</p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-sm font-bold text-emerald-400">참석 ${activeConfirmed.length} / ${match.capacity}명</span>
                                    <button onclick="shareLink(${match.id})" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-lg transition">🔗 매치 공유 링크</button>
                                </div>
                            </div>

                            <!-- 투표 버튼 영역 -->
                            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
                                <p class="text-xs font-bold text-slate-300">💡 투표하기</p>
                                <div class="flex flex-wrap gap-2">
                                    <button onclick="castVote(${match.id}, '참석', '정회원')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-lg transition">🙋‍♂️ 참석</button>
                                    <button onclick="castVote(${match.id}, '미정', '정회원')" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-xs font-bold rounded-lg transition">🤔 미정</button>
                                    <button onclick="castVote(${match.id}, '불참', '정회원')" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-xs font-bold rounded-lg transition">❌ 불참</button>
                                </div>
                                <div class="pt-2 border-t border-slate-800 flex flex-wrap gap-2">
                                    <button onclick="openGuestModal(${match.id}, '용병')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded-lg transition">⚔️ 용병 신청</button>
                                    <button onclick="openGuestModal(${match.id}, '지인')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-xs font-bold rounded-lg transition">🤝 지인 동반</button>
                                    <button onclick="openGuestModal(${match.id}, '가입전 참가')" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-xs font-bold rounded-lg transition">🌟 가입전 참가</button>
                                </div>
                            </div>

                            <!-- 명단 표시 영역 -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                <!-- 확정 명단 -->
                                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-2">
                                    <h3 class="font-bold text-emerald-400">✅ 확정 명단 (${activeConfirmed.length}명)</h3>
                                    <ul class="space-y-1 text-slate-300">
                                        ${activeConfirmed.length === 0 ? '<li class="text-slate-500">아직 참석자가 없습니다.</li>' : ''}
                                        ${activeConfirmed.map((v, idx) => `
                                            <li class="flex justify-between items-center bg-slate-800/60 px-2.5 py-1.5 rounded">
                                                <span>${idx+1}. ${formatName(v.guest_name || currentUser.name)} ${v.guest_type ? `(${v.guest_type})` : ''}</span>
                                                <div class="flex items-center space-x-1">
                                                    ${isAdmin ? `
                                                        <!-- 관리자 전용: 참석 -> 대기자 강제 이동 버튼 -->
                                                        <button onclick="forceMoveVote(${v.id}, 'waiting')" class="px-1.5 py-0.5 bg-amber-600/80 hover:bg-amber-500 text-[10px] rounded font-bold" title="대기자로 강제 이동">대기자로</button>
                                                        <button onclick="deleteVote(${v.id})" class="text-rose-400 hover:text-rose-300 font-bold ml-1">✕</button>
                                                    ` : ''}
                                                </div>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>

                                <!-- 대기자 명단 -->
                                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-2">
                                    <h3 class="font-bold text-amber-400">⏳ 대기자 명단 (${waiting.length}명)</h3>
                                    <ul class="space-y-1 text-slate-300">
                                        ${waiting.length === 0 ? '<li class="text-slate-500">대기 중인 인원이 없습니다.</li>' : ''}
                                        ${waiting.map((v, idx) => `
                                            <li class="flex justify-between items-center bg-slate-800/60 px-2.5 py-1.5 rounded">
                                                <span>${idx+1}. ${formatName(v.guest_name || currentUser.name)} ${v.guest_type ? `(${v.guest_type})` : ''}</span>
                                                <div class="flex items-center space-x-1">
                                                    ${isAdmin ? `
                                                        <!-- 관리자 전용: 대기자 -> 참석 명단 강제 이동 버튼 -->
                                                        <button onclick="forceMoveVote(${v.id}, 'confirmed')" class="px-1.5 py-0.5 bg-emerald-600/80 hover:bg-emerald-500 text-[10px] rounded font-bold" title="참석 명단으로 강제 이동">참석시키기</button>
                                                        <button onclick="deleteVote(${v.id})" class="text-rose-400 hover:text-rose-300 font-bold ml-1">✕</button>
                                                    ` : ''}
                                                </div>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }
                section.innerHTML = html;
            } catch (err) {
                console.error(err);
                section.innerHTML = `<div class="text-center py-10 text-rose-400">데이터를 불러오는 중 오류가 발생했습니다.</div>`;
            }
        }

        // 이름 마스킹 처리 (비회원 접속 시 가운데 글자 * 표시)
        function formatName(name) {
            if (!name) return '익명';
            if (isAdmin || currentUser.name !== '비회원 (방문자)') return name; // 관리자나 로그인 회원은 전체 이름
            if (name.length <= 2) return name[0] + '*';
            return name[0] + '*' + name.slice(2);
        }

        // 투표 등록 (중복 투표 방지: 기존 내역 있으면 업데이트)
        async function castVote(matchId, status, type, guestData = {}) {
            if (!currentUser || currentUser.name === '비회원 (방문자)') {
                alert('로그인 후 투표가 가능합니다.');
                return;
            }

            try {
                // 기존 투표 내역 확인
                let { data: existing } = await supabase
                    .from('match_votes')
                    .select('*')
                    .eq('match_id', matchId)
                    .eq('guest_name', currentUser.name);

                if (existing && existing.length > 0) {
                    // 업데이트
                    await supabase
                        .from('match_votes')
                        .update({ status: status, guest_type: type, ...guestData })
                        .eq('id', existing[0].id);
                } else {
                    // 신규 삽입
                    await supabase
                        .from('match_votes')
                        .insert([{
                            match_id: matchId,
                            guest_name: currentUser.name,
                            status: status,
                            guest_type: type,
                            ...guestData
                        }]);
                }
                alert('투표가 완료되었습니다!');
                loadMatches();
            } catch (err) {
                console.error(err);
                alert('투표 중 오류가 발생했습니다.');
            }
        }

        // 관리자 전용: 강제 상태 변경 (참석 <-> 대기 토글)
        async function forceMoveVote(voteId, targetType) {
            if (!isAdmin) return;
            try {
                // targetType이 'confirmed'면 status를 '참석'으로, 'waiting'이면 용병/지인 타입이거나 순번 조정 필요시 상태 조절
                // 여기서는 참석 명단으로 보낼 때는 '참석', 대기자로 보낼 때는 '대기' 또는 강제로 상태 조절
                let newStatus = '참석';
                let updateData = { status: newStatus };

                if (targetType === 'waiting') {
                    // 대기자로 뺄 때 임시로 guest_type을 '용병(대기)' 또는 상태 변경 처리 가능
                    updateData.guest_type = '대기자';
                } else {
                    updateData.guest_type = '정회원'; // 참석으로 강제 이동 시 일반 정회원격으로 승격
                }

                let { error } = await supabase
                    .from('match_votes')
                    .update(updateData)
                    .eq('id', voteId);

                if (error) throw error;
                alert('명단이 성공적으로 이동되었습니다.');
                loadMatches();
            } catch (err) {
                console.error(err);
                alert('이동 처리 중 오류가 발생했습니다.');
            }
        }

        // 투표 삭제 (✕ 버튼)
        async function deleteVote(voteId) {
            if (!confirm('정말 명단에서 제외하시겠습니까?')) return;
            await supabase.from('match_votes').delete().eq('id', voteId);
            loadMatches();
        }

        // 게스트(용병/지인/가입전 참가) 신청 모달 및 로직
        function openGuestModal(matchId, type) {
            let name = prompt(`[${type}] 신청자 이름을 입력하세요:`);
            if (!name) return;
            let birth = prompt('출생년도 4자리를 입력하세요 (예: 1998):', '1998');
            let phone = prompt('연락처 뒷자리 4자리를 입력하세요:', '1234');

            castVote(matchId, '참석', type, {
                guest_name: `${name} (${birth})`,
                guest_phone: phone
            });
        }

        // 매치 공유 링크 복사
        function shareLink(matchId) {
            const url = window.location.href.split('?')[0] + `?match_id=${matchId}`;
            navigator.clipboard.writeText(url).then(() => {
                alert('매치 공유 링크가 복사되었습니다! 카카오톡 방에 붙여넣기 하세요.');
            });
        }

        // 모달 제어 함수
        function openMatchModal() { document.getElementById('matchModal').classList.remove('hidden'); }
        function closeMatchModal() { document.getElementById('matchModal').classList.add('hidden'); }

        async function createMatch() {
            const venue = document.getElementById('venueInput').value;
            const date = document.getElementById('matchDateInput').value;
            const capacity = document.getElementById('capacityInput').value;
            const cost = document.getElementById('costInput').value;

            if (!venue || !date) {
                alert('구장 이름과 일시는 필수 입력입니다.');
                return;
            }

            let { error } = await supabase.from('matches').insert([{
                match_date: date,
                venue_id: venue,
                capacity: parseInt(capacity),
                cost_amount: cost,
                deadline: date
            }]);

            if (error) {
                alert('일정 등록 실패: ' + error.message);
            } else {
                alert('운동일정이 성공적으로 등록되었습니다!');
                closeMatchModal();
                loadMatches();
            }
        }
    </script>
</body>
</html>
