name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 💡 깃허브 액션이 Pages에 접근할 수 있는 권한을 부여합니다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.output_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
