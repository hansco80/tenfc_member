<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenFC 운동일정 및 투표 (경량화)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">⚽ TenFC 운동일정</h1>
                <p id="user-status" class="text-xs text-slate-400 mt-1">로그인 확인 중...</p>
            </div>
            <div class="flex gap-2">
                <a href="index_2.html" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-semibold">🏠 홈</a>
                <a href="polls.html" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 rounded-lg text-xs font-semibold">🗳️ 투표</a>
                <button onclick="refreshCurrentMonth()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 rounded-lg text-xs font-semibold">🔄 이번 달 새로고침</button>
            </div>
        </header>

        <section class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <button onclick="shiftMonth(-1)" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-bold">◀ 이전 달</button>
                <h2 id="month-label" class="text-lg font-bold text-white">-</h2>
                <button onclick="shiftMonth(1)" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-bold">다음 달 ▶</button>
            </div>
            <div id="match-list" class="space-y-3 text-sm text-slate-300">불러오는 중...</div>
        </section>

        <section id="vote-panel" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hidden">
            <div class="flex justify-between items-center mb-3">
                <h3 id="vote-match-title" class="text-base font-bold text-emerald-400">일정 투표</h3>
                <button onclick="closeVotePanel()" class="text-xs text-slate-400 hover:text-white">닫기 ✕</button>
            </div>
            <div class="flex gap-2 mb-4">
                <button onclick="castMatchVote('attend')" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-bold">✅ 참석</button>
                <button onclick="castMatchVote('maybe')" class="flex-1 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg text-xs font-bold">🤔 미정</button>
                <button onclick="castMatchVote('absent')" class="flex-1 py-2 bg-rose-700 hover:bg-rose-600 rounded-lg text-xs font-bold">❌ 불참</button>
            </div>
            <div id="vote-summary" class="text-xs text-slate-300 space-y-1"></div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = 'https://bxuiwomkpgqsbyaagmlp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mXkGsaxwwfnnAR3lpE8T1A_n0kiPdZj';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // photo 컬럼 제외
        const MEMBER_COLS = 'id, name, password, role, is_withdrawn, rating, birth, kakao_id, position, login_count, last_login_at';

        let members = [];
        let currentUser = null;
        let matches = [];
        let venuesMap = {};
        let votesByMatch = {}; // { [matchId]: [...] }
        let selectedMatchId = null;

        const now = new Date();
        let viewYear = now.getFullYear();
        let viewMonth = now.getMonth(); // 0-based

        function getMonthRange(year, month0) {
            const start = `${year}-${String(month0 + 1).padStart(2, '0')}-01`;
            const lastDay = new Date(year, month0 + 1, 0).getDate();
            const end = `${year}-${String(month0 + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
            return { start, end };
        }

        async function loadMembersLight() {
            const { data, error } = await supabaseClient.from('members').select(MEMBER_COLS);
            if (!error && data) {
                members = data;
                const savedName = localStorage.getItem('tenfc_logged_user');
                currentUser = members.find(m => m.name === savedName && !m.is_withdrawn) || null;
                document.getElementById('user-status').innerText = currentUser
                    ? `로그인: ${currentUser.name} 님 (${currentUser.role})`
                    : '비로그인 상태 (일정 열람만 가능)';
            }
        }

        async function loadVenuesOnce() {
            if (Object.keys(venuesMap).length > 0) return;
            const { data, error } = await supabaseClient.from('venues').select('id, name, address');
            if (!error && data) {
                data.forEach(v => { venuesMap[v.id] = v; });
            }
        }

        async function loadMonthMatches(year, month0) {
            document.getElementById('month-label').innerText = `${year}년 ${month0 + 1}월`;
            const { start, end } = getMonthRange(year, month0);

            const { data: matchRows, error } = await supabaseClient
                .from('matches')
                .select('id, match_date, start_time, end_time, venue_id, title, status')
                .gte('match_date', start)
                .lte('match_date', end)
                .order('match_date', { ascending: true });

            if (error) {
                document.getElementById('match-list').innerText = '일정 조회 실패';
                return;
            }

            matches = matchRows || [];
            const matchIds = matches.map(m => m.id);
            votesByMatch = {};
            matchIds.forEach(id => { votesByMatch[id] = []; });

            // 해당 월의 일정 ID에 대해서만 투표 조회
            if (matchIds.length > 0) {
                const { data: voteRows } = await supabaseClient
                    .from('match_votes')
                    .select('id, match_id, member_name, status')
                    .in('match_id', matchIds);

                (voteRows || []).forEach(v => {
                    if (!votesByMatch[v.match_id]) votesByMatch[v.match_id] = [];
                    votesByMatch[v.match_id].push(v);
                });
            }

            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('match-list');
            if (matches.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-xs">해당 월에 등록된 운동일정이 없습니다.</p>';
                return;
            }

            container.innerHTML = matches.map(m => {
                const venue = venuesMap[m.venue_id];
                const list = votesByMatch[m.id] || [];
                const attendCnt = list.filter(x => x.status === 'attend').length;
                const maybeCnt = list.filter(x => x.status === 'maybe').length;
                const absentCnt = list.filter(x => x.status === 'absent').length;

                return `
                    <div class="p-3.5 rounded-xl bg-slate-900/70 border border-slate-700 flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <div class="font-bold text-white">${m.match_date} ${m.start_time || ''} · ${m.title || '정기 풋살'}</div>
                            <div class="text-xs text-slate-400 mt-0.5">📍 ${venue ? venue.name : '구장 미지정'}</div>
                            <div class="text-xs text-emerald-300 mt-1">참석 ${attendCnt} · 미정 ${maybeCnt} · 불참 ${absentCnt}</div>
                        </div>
                        <button onclick="openVotePanel(${m.id})" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-bold">투표하기</button>
                    </div>
                `;
            }).join('');
        }

        function openVotePanel(matchId) {
            selectedMatchId = matchId;
            const m = matches.find(x => x.id === matchId);
            document.getElementById('vote-match-title').innerText = `${m ? m.match_date : ''} 투표 현황`;
            document.getElementById('vote-panel').classList.remove('hidden');
            renderVoteSummary();
        }

        function closeVotePanel() {
            selectedMatchId = null;
            document.getElementById('vote-panel').classList.add('hidden');
        }

        function renderVoteSummary() {
            if (!selectedMatchId) return;
            const list = votesByMatch[selectedMatchId] || [];
            const attend = list.filter(x => x.status === 'attend').map(x => x.member_name);
            const maybe = list.filter(x => x.status === 'maybe').map(x => x.member_name);
            const absent = list.filter(x => x.status === 'absent').map(x => x.member_name);

            document.getElementById('vote-summary').innerHTML = `
                <div><span class="text-emerald-400 font-bold">참석 (${attend.length}):</span> ${attend.join(', ') || '-'}</div>
                <div><span class="text-amber-400 font-bold">미정 (${maybe.length}):</span> ${maybe.join(', ') || '-'}</div>
                <div><span class="text-rose-400 font-bold">불참 (${absent.length}):</span> ${absent.join(', ') || '-'}</div>
            `;
        }

        async function castMatchVote(status) {
            if (!currentUser) {
                alert('먼저 index_2.html에서 로그인해 주세요.');
                return;
            }
            if (!selectedMatchId) return;

            const payload = {
                match_id: selectedMatchId,
                member_name: currentUser.name,
                status
            };

            const { data, error } = await supabaseClient
                .from('match_votes')
                .upsert(payload, { onConflict: 'match_id,member_name' })
                .select('id, match_id, member_name, status')
                .maybeSingle();

            if (error) {
                alert('투표 저장 실패: ' + error.message);
                return;
            }

            // 로컬 상태만 즉시 갱신 (전체 재조회 없음)
            const arr = votesByMatch[selectedMatchId] || [];
            const idx = arr.findIndex(x => x.member_name === currentUser.name);
            const row = data || payload;
            if (idx >= 0) arr[idx] = row;
            else arr.push(row);

            renderMatches();
            renderVoteSummary();
        }

        async function shiftMonth(delta) {
            const d = new Date(viewYear, viewMonth + delta, 1);
            viewYear = d.getFullYear();
            viewMonth = d.getMonth();
            closeVotePanel();
            await loadMonthMatches(viewYear, viewMonth);
        }

        async function refreshCurrentMonth() {
            await loadMonthMatches(viewYear, viewMonth);
        }

        (async function init() {
            await Promise.all([loadMembersLight(), loadVenuesOnce()]);
            await loadMonthMatches(viewYear, viewMonth);
        })();
    </script>
</body>
</html>
